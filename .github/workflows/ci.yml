name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: test (race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...
      - name: coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=30s
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
      - uses: actions/upload-artifact@v4
        with:
          name: pagerelic-binaries
          path: dist/
